name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build frontend and validate Worker bundle
        run: npm run check

  deploy:
    name: Deploy production
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://gov.buildcanada.com
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Skip a superseded commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo 'superseded=true' >> "$GITHUB_OUTPUT"
            echo 'A newer main commit will deploy instead.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy Cloudflare Worker and assets
        if: steps.current.outputs.superseded != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Set the repository secret CLOUDFLARE_API_TOKEN to enable production deployment.' >&2
            exit 1
          fi
          npm run deploy
      - name: Check production health
        if: steps.current.outputs.superseded != 'true'
        run: |
          node --input-type=module <<'JS'
          const response = await fetch('https://gov.buildcanada.com/api/health', {signal: AbortSignal.timeout(15000)});
          if (!response.ok || (await response.json()).ok !== true) throw new Error('Production health check failed');
          console.log('Production health check passed');
          JS
